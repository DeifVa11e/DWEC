<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uppercase & Lowercase</title>
    <script type="text/javascript">
        function message() {
            alert("mensaje de función llamada");
        }
        function Message() {
            alert("Mensaje de función llamada");
        }
    </script>
</head>
<body>
    <h2>Esta es la diferencia:</h2>
    Lowercase:<input type="button" onclick="message();" value="pulse" />
    Uppercase:<input type="button" onclick="Message();" value="pulse" />
</body>
</html>
