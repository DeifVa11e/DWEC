<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Max value & Min value</title>
</head>
<body>
    <script>
        const maxValue = Number.MAX_VALUE;
        const minValue = Number.MIN_VALUE;
        const maxValue2 = Number.MAX_VALUE * 2;

        alert(maxValue);
        alert(minValue);
        alert(maxValue2);
    </script>
</body>
</html>
