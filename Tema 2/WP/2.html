<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script type="text/javascript">
        function verBucle() {
            var boton = document.getElementById('btn');
            for (var p in boton) {
                console.log(`${p}: ${boton[p]}`);
            }
        }
    </script>
</head>
<body>
    <input type="button" id="btn" onclick="verBucle()" value="Pulsar" />
</body>
</html>
