<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p id="demo"></p>

    <script>
        function person(first, last, age, eye) {
            this.first = first;
            this.last = last;
            this.age = age;
            this.eye = eye;
            this.nationality = "English";
            this.name = function() {
            return this.first + " " + this.last;
            }
        }

        var myFarther = new person("Jhon", "Doe", 50, "blue");
        document.getElementById('demo').innerHTML += "My father is " + myFarther.name();

        var myMother = new person("Sally", "Rally", 48, "green");
        document.getElementById('demo').innerHTML += "My mothes is " + myMother.name();
    </script>
</body>
</html>
