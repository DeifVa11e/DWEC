<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p id="demo"></p>

    <script>
        function person(first, last, age, eye) {
            this.first = first;
            this.last = last;
            this.age = age;
            this.eye = eye;
        }

        person.prototype.nationality = "English";

        person.prototype.name_nation = function() {
            return this.first + " " + this.last + " " + this.nationality;
        }

        person.prototype.changename = function() {
            this.first = prompt("Introduce nuevo nombre:");
            return this.first + " " + this.last;
        }

        var myFarther = new person("Jhon", "Doe", 50, "blue");
        document.getElementById('demo').innerHTML += "My father is " + myFarther.changename() + myFarther.nationality();

        var myMother = new person("Sally", "Rally", 48, "green");
        document.getElementById('demo').innerHTML += "My mothes is " + myMother.name_nation();

    </script>
</body>
</html>
